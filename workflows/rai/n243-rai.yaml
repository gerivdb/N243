# Workflow — N243 RAI

## Objectif

Executer les cycles RAI (Recursive Auto-Improvement) jusqu'a convergence.

## Declencheurs

- **probe fail** : une probe echoue
- **daily** : cycle quotidien
- **manual** : declenchement manuel

## Etapes

| Etape | Action | Input | Output |
|-------|--------|-------|--------|
| 1 | run-probes | Probe suite | Resultats probes |
| 2 | mine-logs | WAL/ | Patterns d'usage |
| 3 | edit-prd | PRD + patterns | PRD mis a jour |
| 4 | validate-mox | PRD | Validation MOX |
| 5 | flux-d4-gate | Changes | Approval |
| 6 | log-wal | Event RAI | WAL entry |

## Criteres de convergence

- Tous les probes passent
- Aucun nouveau probe derive sur 24h
- phi-CPS stable sur 3 mesures
- Aucune contradiction MOX

## Rollback

1. Revenir au PRD precedent.
2. Logger le revert dans WAL.
3. Corriger via PR review FLUX-D4.

