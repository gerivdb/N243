# Workflow — N243 Ingestion

## Objectif

Scanne les repos, extrait les metadonnees, construit le graphe, et met a jour l'index N243.

## Declencheurs

- **git commit** : a chaque commit sur les repos actifs
- **nightly** : scan complet quotidien
- **manual** : declenchement manuel

## Etapes

| Etape | Action | Input | Output |
|-------|--------|-------|--------|
| 1 | scan-repos | TOPOS/repo-manifest.yaml | Liste repos actifs |
| 2 | extract-metadata | Liste repos | Metadonnees (ADR, PRD, INTENT, etc.) |
| 3 | build-graph | Metadonnees | Graphe N243 |
| 4 | update-embeddings | Graphe | Embeddings LLUX |
| 5 | log-wal | Event ingestion | WAL entry |

## Criteres

| CRITERE | SEUIL | METHODE |
|---------|-------|---------|
| Scan complet | 100% repos actifs | Comparaison known_repositories.yaml |
| Graphe a jour | < 5 min | Timestamp |
| Embeddings a jour | < 10 min | Timestamp |
| WAL log | 100% | WAL entry |

## Rollback

1. Restaurer le graphe precedent.
2. Logger le revert dans WAL.
3. Corriger via PR review N243-BUILDER.

## References

- `TOPOS/repo-manifest.yaml`
- `GOVERNANCE-HUB/known_repositories.yaml`
- `D:\DO\WEB\TOOLS\L4-TOOLS\N243\data\`


