# Workflow — N243 Query

## Objectif

Repondre aux requêtes cross-repo, temporelles et de contradiction.

## Declencheurs

- **user query** : question utilisateur
- **auto-dev probe** : verification automatique
- **MOX validation** : validation coherence

## Etapes

| Etape | Action | Input | Output |
|-------|--------|-------|--------|
| 1 | validate-query | Requête brute | Requête validée |
| 2 | check-cache | Requête validée | Cache hit/miss |
| 3 | execute-tql | Requête validée | Résultat brut |
| 4 | format-result | Résultat brut | Résultat formaté |
| 5 | log-wal | Event query | WAL entry |

## Criteres

| CRITERE | SEUIL | METHODE |
|---------|-------|---------|
| Reponse < 2s | 95% requêtes | Benchmark |
| Cache hit | > 50% | KORX metrics |
| Sources tracees | 100% | IntentHash par affirmation |
| WAL log | 100% | WAL entry |

## Rollback

1. Revenir au cache precedent.
2. Logger le revert dans WAL.
3. Corriger via PR review N243-QUERY.

## References

- `TQL/` : operateurs de requête
- `CTULU/` : orchestrateur TQL
- `KORX/` : cache contexte
- `KRONOS/` : time-series


