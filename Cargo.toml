[package]
name = "n243"
version = "0.1.0"
edition = "2021"

[dependencies]
# Orchestration : bus WAZAA (Python, port 1873) — plus de dépendance Rust Buzz@block
# (pivot 2026-08-23, INTENT-2026-08-22-KG-L-WAZAA-N243-SOUVERAIN-V0_5).
# Les crates buzz-core/acp/workflow/auth sont supprimées ; l'invocation passe par
# le bus WAZAA (Intent/events) et le WAL append-only (wal_event_emitter.py).

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }

[features]
default = []
